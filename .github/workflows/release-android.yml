name: Publish Android release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          pubspec_version=$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml)
          if [[ ! "$pubspec_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)\+([0-9]+)$ ]]; then
            echo "Invalid pubspec version: $pubspec_version" >&2
            exit 1
          fi

          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          build="${BASH_REMATCH[4]}"
          tag="v$version"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi

          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BIOGEST_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.BIOGEST_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BIOGEST_ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.BIOGEST_ANDROID_STORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" || -z "$STORE_PASSWORD" ]]; then
            echo "Android signing secrets are incomplete." >&2
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build signed APKs
        shell: bash
        run: |
          mkdir -p release
          mapfile -t clinics < <(jq -er '.clinics[] | select(type == "string" and length > 0)' config/clinics.json)
          if [[ ${#clinics[@]} -eq 0 ]]; then
            echo "No clinics are configured in config/clinics.json." >&2
            exit 1
          fi
          for clinic in "${clinics[@]}"; do
            flutter build apk --release \
              --build-name=${{ steps.version.outputs.name }} \
              --build-number=${{ steps.version.outputs.build }} \
              --dart-define=CLINIC_CODE="$clinic"
            cp build/app/outputs/flutter-apk/app-release.apk \
              "release/MyBio-$clinic-${{ steps.version.outputs.tag }}.apk"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MyBio ${{ steps.version.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*.apk
