name: Publish Android release

on:
  workflow_dispatch:
    inputs:
      clinic:
        description: Optional exact clinic name to build
        required: false
        type: string
      regenerate:
        description: Rebuild and replace APKs that are already attached to this version
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          pubspec_version=$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml)
          if [[ ! "$pubspec_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)\+([0-9]+)$ ]]; then
            echo "Invalid pubspec version: $pubspec_version" >&2
            exit 1
          fi

          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          build="${BASH_REMATCH[4]}"
          tag="v$version"

          tag_exists=false
          if git rev-parse "$tag" >/dev/null 2>&1; then
            tag_commit=$(git rev-list -n 1 "$tag")
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $tag belongs to a different commit." >&2
              exit 1
            fi
            tag_exists=true
          fi

          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"

      - name: Restore Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BIOGEST_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.BIOGEST_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BIOGEST_ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.BIOGEST_ANDROID_STORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" || -z "$STORE_PASSWORD" ]]; then
            echo "Android signing secrets are incomplete." >&2
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Select APKs to build
        id: clinics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLINIC: ${{ inputs.clinic }}
          REGENERATE: ${{ inputs.regenerate }}
          TAG: ${{ steps.version.outputs.tag }}
          TAG_EXISTS: ${{ steps.version.outputs.tag_exists }}
        run: |
          mapfile -t configured_clinics < <(jq -er '.clinics[] | select(type == "string" and length > 0)' config/clinics.json)
          if [[ ${#configured_clinics[@]} -eq 0 ]]; then
            echo "No clinics are configured in config/clinics.json." >&2
            exit 1
          fi

          if [[ -n "$CLINIC" ]]; then
            if ! printf '%s\n' "${configured_clinics[@]}" | grep -Fxq "$CLINIC"; then
              echo "Clinic '$CLINIC' is not configured." >&2
              exit 1
            fi
            selected_clinics=("$CLINIC")
          else
            selected_clinics=("${configured_clinics[@]}")
          fi

          existing_assets='[]'
          if [[ "$TAG_EXISTS" == "true" ]]; then
            existing_assets=$(gh release view "$TAG" --json assets --jq '[.assets[].name]')
          fi

          : > selected-clinics.txt
          for clinic in "${selected_clinics[@]}"; do
            asset="MyBio-$clinic-$TAG.apk"
            if [[ "$REGENERATE" != "true" ]] && jq -e --arg asset "$asset" 'index($asset) != null' <<< "$existing_assets" >/dev/null; then
              echo "Skipping existing asset: $asset"
              continue
            fi
            printf '%s\n' "$clinic" >> selected-clinics.txt
          done

          echo "count=$(wc -l < selected-clinics.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Build selected signed APKs
        if: steps.clinics.outputs.count != '0'
        shell: bash
        run: |
          mkdir -p release
          while IFS= read -r clinic; do
            flutter build apk --release \
              --build-name=${{ steps.version.outputs.name }} \
              --build-number=${{ steps.version.outputs.build }} \
              --dart-define=CLINIC_CODE="$clinic"
            cp build/app/outputs/flutter-apk/app-release.apk \
              "release/MyBio-$clinic-${{ steps.version.outputs.tag }}.apk"
          done < selected-clinics.txt

      - name: Publish or update GitHub release
        if: steps.clinics.outputs.count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: MyBio ${{ steps.version.outputs.name }}
          TAG_EXISTS: ${{ steps.version.outputs.tag_exists }}
        run: |
          if [[ "$TAG_EXISTS" != "true" ]]; then
            gh release create "$TAG" release/*.apk \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --generate-notes
          else
            gh release upload "$TAG" release/*.apk --clobber
          fi

      - name: Report unchanged release
        if: steps.clinics.outputs.count == '0'
        run: echo "All requested APKs are already attached to ${{ steps.version.outputs.tag }}."
