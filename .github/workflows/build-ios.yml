name: Build iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Restore environment configuration
        shell: bash
        env:
          APP_ENV: ${{ secrets.BIOGEST_ENV }}
        run: printf '%s' "$APP_ENV" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source code
        run: flutter analyze

      - name: Build unsigned iOS application
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry BiogestClinic-unsigned.ipa Payload

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BiogestClinic-iOS-unsigned
          path: |
            build/ios/ipa/BiogestClinic-unsigned.ipa
            build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14
